<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#00796b}

</head>
<body>
<div id="header">
  <div>
    <h1>🗺️ TIVOLI TERME 92</h1>

  </div>
</div>
<div id="map"></div>
<button id="nav-btn" onclick="navigaVerso()">🧭 Naviga verso questo territorio</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var centro = [41.954375, 12.717686];
var map = L.map('map').setView(centro, 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

var parti = [{"tipo":"line","coords":[[41.95288,12.71863],[41.95296,12.71865],[41.95327,12.71865],[41.95388,12.71863],[41.95357,12.71714],[41.95344,12.71711],[41.95326,12.71709],[41.95274,12.71703]]},{"tipo":"polygon","coords":[[41.95389,12.71867],[41.95359,12.71869],[41.95317,12.7187],[41.95305,12.71869],[41.95305,12.71879],[41.95392,12.71887],[41.95389,12.71867]]},{"tipo":"polygon","coords":[[41.95355,12.71701],[41.95317,12.71695],[41.95316,12.71702],[41.95351,12.71707],[41.95357,12.71709],[41.95355,12.71701]]},{"tipo":"polygon","coords":[[41.95526,12.71773],[41.95521,12.71768],[41.95518,12.71759],[41.95516,12.71742],[41.95515,12.71702],[41.95498,12.71702],[41.95445,12.717],[41.95414,12.71702],[41.9539,12.71704],[41.95362,12.71701],[41.95361,12.71704],[41.95398,12.71886],[41.95417,12.71881],[41.95424,12.71871],[41.9543,12.71864],[41.95523,12.71794],[41.95526,12.71773]]},{"tipo":"polygon","coords":[[41.95536,12.71709],[41.9553,12.71705],[41.9552,12.71703],[41.95523,12.71756],[41.95524,12.71762],[41.95527,12.71765],[41.95527,12.71763],[41.9553,12.71748],[41.95536,12.71709]]},{"tipo":"polygon","coords":[[41.95553,12.71773],[41.95546,12.71718],[41.9554,12.71711],[41.95538,12.71727],[41.95534,12.71751],[41.95532,12.71764],[41.9553,12.71771],[41.95529,12.7179],[41.95553,12.71773]]}];
var bounds = L.latLngBounds();
parti.forEach(function(p) {
  var layer;
  if (p.tipo === 'polygon') {
    layer = L.polygon(p.coords, {color:'#00796b',fillColor:'#26a69a',fillOpacity:0.35,weight:2.5}).addTo(map);

  bounds.extend(layer.getBounds());
});
if (bounds.isValid()) map.fitBounds(bounds, {padding:[30,30]});

function navigaVerso() {
